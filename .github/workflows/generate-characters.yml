name: Generate All Anime Characters

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Run Background Generation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/generate_characters.mjs

      - name: Commit and Push Updated animeData2.js
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add animeData2.js
          if ! git diff-index --quiet HEAD --; then
            git commit -m "feat: incremental update of animeData2.js characters"
            git push origin main
          else
            echo "No changes to commit."
          fi
