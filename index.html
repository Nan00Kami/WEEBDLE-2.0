<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Weebdle - Anime Guessing Game</title>
  <style>
    :root {
      --bg: #121214;
      --card-bg: #1e1e24;
      --text: #f3f3f6;
      --accent: #ff4a6e;
      --correct: #2e7d32;
      --incorrect: #c62828;
      --partial: #f57f17;
      --higher-lower: #1565c0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0;
      padding: 2rem 1rem;
    }

    h1 {
      margin-bottom: 0.5rem;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    p.subtitle {
      color: #8c8c99;
      margin-bottom: 2rem;
    }

    .input-section {
      display: flex;
      gap: 0.5rem;
      width: 100%;
      max-width: 500px;
      margin-bottom: 2rem;
    }

    input[type="text"] {
      flex: 1;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      border: 1px solid #333;
      background: var(--card-bg);
      color: var(--text);
      font-size: 1rem;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: var(--accent);
    }

    button {
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 8px;
      background: var(--accent);
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    button:hover {
      opacity: 0.9;
    }

    #status-msg {
      margin-bottom: 1.5rem;
      font-size: 1.1rem;
      font-weight: bold;
      text-align: center;
    }

    .table-container {
      width: 100%;
      max-width: 900px;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0.5rem;
      text-align: center;
    }

    th {
      padding: 0.75rem 0.5rem;
      background: #18181f;
      border-radius: 6px;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    td {
      padding: 1rem 0.5rem;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 500;
      background-color: var(--card-bg);
    }

    .cell-correct { background-color: var(--correct) !important; }
    .cell-incorrect { background-color: var(--incorrect) !important; }
    .cell-partial { background-color: var(--partial) !important; }
    .cell-higher { background-color: var(--higher-lower) !important; }
    .cell-lower { background-color: var(--higher-lower) !important; }
  </style>
</head>
<body>

  <h1>WEEBDLE</h1>
  <p class="subtitle">Guess the mystery anime from the dataset</p>

  <div class="input-section">
    <input type="text" id="anime-input" list="anime-options" placeholder="Search anime title..." autocomplete="off" />
    <datalist id="anime-options"></datalist>
    <button id="guess-btn">Submit</button>
  </div>

  <div id="status-msg"></div>

  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>Title</th>
          <th>Type</th>
          <th>Release Year</th>
          <th>Episodes</th>
          <th>Genres</th>
          <th>Score</th>
        </tr>
      </thead>
      <tbody id="guess-list"></tbody>
    </table>
  </div>

  <script src="script.js"></script>
</body>
</html>
