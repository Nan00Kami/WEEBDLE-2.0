<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Prevents MAL CDN from blocking image requests -->
  <meta name="referrer" content="no-referrer" />
  <title>WEEBDLE — The Daily Anime Guessing Game</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <header class="header">
      <div class="header-left">
        <button id="help-btn" class="icon-btn" aria-label="Help">?</button>
      </div>
      <h1 class="title">WEEBDLE</h1>
      <div class="header-right">
        <button id="stats-btn" class="icon-btn" aria-label="Stats">📊</button>
      </div>
    </header>

    <div class="instruction-banner">
      Guess today's mystery anime. Green means exact match; yellow indicates partial genre match.
    </div>

    <!-- Input Section -->
    <div class="search-section">
      <div class="input-wrapper">
        <input 
          type="text" 
          id="anime-input" 
          placeholder="Type an anime title (e.g. Steins;Gate, Naruto)..." 
          autocomplete="off" 
        />
        <ul id="autocomplete-list" class="autocomplete-dropdown hidden"></ul>
      </div>
    </div>

    <!-- Guess Table / Grid -->
    <div class="grid-container">
      <div class="grid-header">
        <div>Poster</div>
        <div>Title</div>
        <div>Year</div>
        <div>MAL Rank</div>
        <div>Genres</div>
      </div>
      <div id="guesses-container" class="guesses-list">
        <!-- Rows injected dynamically via app.js -->
      </div>
    </div>

    <!-- Win/Loss Overlay Modal -->
    <div id="game-modal" class="modal hidden">
      <div class="modal-content">
        <button id="close-modal" class="close-btn">&times;</button>
        <h2 id="modal-title">Victory!</h2>
        <div id="modal-poster-wrap"></div>
        <p id="modal-desc"></p>
        <div class="share-box">
          <button id="share-btn">Share Result 📋</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Critical: Load master catalog FIRST so app.js can access MASTER_ANIME_DATA -->
  <script src="animeData.js"></script>
  <script src="app.js"></script>
</body>
</html>
